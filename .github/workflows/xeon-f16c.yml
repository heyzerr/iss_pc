      - name: Install MSYS2 CLANG64 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git patch

      - name: Install official port dependencies
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-clang-x86_64-{toolchain,cmake,ninja,pkgconf,python} \
            mingw-w64-clang-x86_64-{vulkan-headers,vulkan-loader,vulkan-memory-allocator,glslang} \
            mingw-w64-clang-x86_64-{sdl3,fmt,boost,robin-map,xxhash,ffmpeg,zydis} \
            mingw-w64-clang-x86_64-{spirv-tools,spirv-headers,spirv-cross}

      - name: Build Windows loader (not the whole graphical launcher)
        shell: msys2 {0}
        run: |
          cd port
          TLG_LTO=OFF bash build.sh

      - name: Upload compiled loader
        uses: actions/upload-artifact@v4
        with:
          name: tlg-probe-xeon-f16c
          path: port/out/tlg-probe.exe
          if-no-files-found: error
