name: RX580 experimental Vulkan TRACE V5.1 Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rx580_rgba2d_test.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: port
    steps:
      - name: Checkout HayatoG source at known commit
        uses: actions/checkout@v4
        with:
          repository: HayatoG/iss_pc
          ref: 5d2323e5716a46a86fd16ffc49dba39bc47029ba
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-freetype
      - name: Apply V5.1 RX580 diagnostic and explicit-range experiment
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode(""""""), "rx580_v51_patch.py", "exec"))
          PY
          grep -n 'RX580 EXPERIMENT ACTIVE' gpu/shadps4/video_core/texture_cache/image_info.cpp
          grep -n 'V5 TARGET' gpu/shadps4/video_core/texture_cache/image.cpp
          grep -n 'V5 vkCmdPipelineBarrier2 BEGIN' gpu/shadps4/video_core/renderer_vulkan/vk_runtime.cpp
      - name: Build Windows
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          TLG_LTO=OFF bash build.sh
      - name: Package Windows
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
          WINPYTHON_WIN: ${{ steps.python.outputs.python-path }}
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          export WINPYTHON=$(cygpath -u "$WINPYTHON_WIN")
          bash packaging/windows/package.sh
          test -f dist/infamous-windows-x86_64.zip
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: infamous-rx580-V5_1-barrier-test
          path: port/dist/infamous-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
