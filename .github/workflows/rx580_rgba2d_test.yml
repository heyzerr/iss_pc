name: RX580 Shader Compiler Safe - Polaris 907ab47
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rx580_rgba2d_test.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: port
    steps:
      - name: Checkout HayatoG source at known commit
        uses: actions/checkout@v4
        with:
          repository: HayatoG/iss_pc
          ref: 907ab4796f6a402d55a69bd2bef7b08594bb57a5
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-freetype
      - name: Patch shader pipeline optimizations (graphics and compute)
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode(""""""), 'apply_rx580_pipeline.py', 'exec'))
          PY
          python - <<'PYVERIFY'
          from pathlib import Path
          root=Path('gpu/shadps4/video_core/renderer_vulkan')
          for name in ('vk_graphics_pipeline.cpp', 'vk_compute_pipeline.cpp'):
              text=(root/name).read_text(encoding='utf8')
              assert text.count('TLG_RX580_SAFE_PIPELINES') == 1, (name, 'switch count wrong')
              assert 'vk::PipelineCreateFlagBits::eDisableOptimization' in text, name
              assert 'RX580 SAFE_PIPELINES ACTIVE' in text, name
              print('PATCH VERIFIED:',name)
          PYVERIFY
      - name: Build Windows
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          TLG_LTO=OFF bash build.sh
      - name: Package Windows
        env:
          MSYS2_ROOT: ${{ runner.temp }}/msys64
          WINPYTHON_WIN: ${{ steps.python.outputs.python-path }}
        run: |
          export MSYS2_ROOT=$(cygpath -u "$MSYS2_ROOT")
          export WINPYTHON=$(cygpath -u "$WINPYTHON_WIN")
          bash packaging/windows/package.sh
          test -f dist/infamous-windows-x86_64.zip
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: infamous-rx580-safe-pipelines-907ab47-experimental
          path: port/dist/infamous-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
